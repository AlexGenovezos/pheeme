<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Pheeme</title>
    <!--
      Critical paint: the theme background before any CSS or JS loads, so launch
      never flashes white. Fallback colors must equal --color-app-bg in
      src/styles/themes/{light,dark}.ts (theme.test.ts checks); a custom theme's
      background comes from the boot script below.
    -->
    <style>
      html {
        background: var(--color-app-bg, #ffffff);
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: var(--color-app-bg, #15191a);
          color-scheme: dark;
        }
      }
      html[data-theme="light"] {
        background: var(--color-app-bg, #ffffff);
        color-scheme: light;
      }
      html[data-theme="dark"] {
        background: var(--color-app-bg, #15191a);
        color-scheme: dark;
      }
    </style>
    <script>
      // Apply an explicit Light/Dark choice before first paint (System needs no JS:
      // the media query above handles it), and the chosen theme's background, which
      // differs from the fallbacks above for a custom theme. Keys mirror THEME_MODE_KEY
      // and THEME_BOOT_KEY in src/theme/theme.ts.
      (function () {
        try {
          var root = document.documentElement;
          var mode = localStorage.getItem("pheeme.theme-mode");
          if (mode === "light" || mode === "dark") root.setAttribute("data-theme", mode);
          var boot = JSON.parse(localStorage.getItem("pheeme.theme-boot") || "null");
          var kind =
            mode === "light" || mode === "dark"
              ? mode
              : matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          var bg = boot && boot[kind];
          if (typeof bg === "string" && /^#[0-9a-f]{6}$/i.test(bg))
            root.style.setProperty("--color-app-bg", bg);
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
