[package]
name = "pheeme"
version = "0.6.0"
description = "Pheeme: an open-source desktop Gmail client"
authors = []
edition = "2021"

[lib]
name = "pheeme_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The benchmarks (Linux, needs valgrind and libclang): exposes the in-memory Gmail
# (`sync::fake`) and pulls in gungraun.
bench = ["dep:gungraun"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
open = "5"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
mailparse = "0.15"
futures = "0.3"
async-trait = "0.1"
ammonia = "4"
percent-encoding = "2"
lettre = { version = "0.11", default-features = false, features = ["builder"] }
mime_guess = "2"
bytes = "1"

# Valgrind only runs on Linux. Optional so that plain builds don't need libclang.
[target.'cfg(target_os = "linux")'.dependencies]
gungraun = { version = "0.20.0", features = ["act"], optional = true }

# Same major as keyring's apple-native backend, to recognise its macOS error codes.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

# Instruction-count benchmarks under Valgrind: `cargo bench --features bench`
# (needs `gungraun-runner` 0.20.0 too). See docs/performance.md.
[[bench]]
name = "hot_paths"
harness = false
required-features = ["bench"]
