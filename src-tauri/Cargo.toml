[package]
name = "pheeme"
version = "0.22.0"
description = "Pheeme: an open-source desktop Gmail client"
authors = []
edition = "2021"

[lib]
name = "pheeme_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Exposes the in-memory Gmail (`sync::fake`) to the benchmarks and the heap soak test.
test-support = []
# The benchmarks (Linux, needs valgrind and libclang).
bench = ["test-support", "dep:gungraun"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "parking_lot", "rt-multi-thread", "sync", "time"] }
# rustls with the OS's certificate verifier (rustls-platform-verifier), on ring: the provider the
# updater plugin also uses. `http::client_builder` installs it. No native-tls, so no OpenSSL build.
reqwest = { version = "0.13", default-features = false, features = ["charset", "form", "http2", "json", "multipart", "query", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio", "migrate"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
file-rotate = "0.8"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.11"
hmac = "0.13"
rand = "0.10"
open = "5"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
mailparse = "0.18"
futures = "0.3"
async-trait = "0.1"
ammonia = "4"
percent-encoding = "2"
lettre = { version = "0.11", default-features = false, features = ["builder"] }
mime_guess = "2"
bytes = "1"
snow = "0.10"
if-addrs = "0.15"
zeroize = "1"
rquickjs = "0.14"
regex = "1"
# The AI assistants' MCP server (`mcp/`): plain HTTP/1.1 on loopback. Already in the tree via reqwest.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# Diagnostics bundles: deflate only (flate2's Rust backend, as file-rotate already uses).
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
rrule = "0.14"
chrono-tz = "0.10"

# Valgrind only runs on Linux. Optional so that plain builds don't need libclang.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
gungraun = { version = "0.20.0", features = ["act"], optional = true }

# Same major as keyring's apple-native backend, to recognise its macOS error codes.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(target_os = "windows")'.dependencies]
winrt-notification = { package = "tauri-winrt-notification", version = "0.7" }
# The Windows build number for the anonymous usage ping (already in the tree via tao).
windows-version = "0.100"

[dev-dependencies]
dhat = "0.3.3"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
wiremock = "0.6"

# Instruction-count benchmarks under Valgrind: `cargo bench --features bench`
# (needs `gungraun-runner` 0.20.0 too). See docs/performance.md.
[[bench]]
name = "hot_paths"
harness = false
required-features = ["bench"]

# Heap soak and leak check under dhat: `cargo test --profile soak --features test-support --test soak`.
# See docs/performance.md.
[[test]]
name = "soak"
required-features = ["test-support"]

# Shipping builds. Measured in docs/performance.md ("Release profile"): the binary
# drops from 47.9 MB to 28.1 MB, with no slower build. Fat LTO saved 1.2 MB more for a 15%
# longer build.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Benchmarks and the heap soak keep cargo's release defaults: they build on every PR, the
# benchmarks compare a PR against its base, and dhat's heap profile needs symbol names.
[profile.bench]
lto = false
codegen-units = 16
strip = "debuginfo"

[profile.soak]
inherits = "bench"
