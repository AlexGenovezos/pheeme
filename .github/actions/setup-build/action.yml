name: Set up build environment
description: >-
  Node from .nvmrc (npm cache), the Linux system libraries Tauri needs, the Rust toolchain from
  rust-toolchain.toml, and the src-tauri Rust cache. Run actions/checkout first.

inputs:
  node:
    description: Set up Node (.nvmrc) with the npm cache ("true" or "false").
    default: "true"
  rust-targets:
    description: Space-separated extra rustup targets to add. Empty adds none.
    default: ""
  rust-components:
    description: Space-separated extra rustup components to add. Empty adds none.
    default: ""
  cache-key:
    description: shared-key for Swatinem/rust-cache. Jobs with the same key share a cache.
    required: true
  save-if:
    description: Whether to save the Rust cache. Defaults to runs on main.
    default: ${{ github.ref == 'refs/heads/main' }}

runs:
  using: composite
  steps:
    - if: inputs.node == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm
    # Cached: `apt-get update` plus the WebKit install took ~50s in every Linux job.
    - name: Install Ubuntu dependencies
      if: runner.os == 'Linux'
      uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
      with:
        packages: libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libsoup-3.0-dev libdbus-1-dev
        version: "1"
    - shell: bash
      run: rustup toolchain install
    - if: inputs.rust-targets != ''
      shell: bash
      env:
        TARGETS: ${{ inputs.rust-targets }}
      # Word-split on purpose: the input is a space-separated list.
      run: rustup target add $TARGETS
    - if: inputs.rust-components != ''
      shell: bash
      env:
        COMPONENTS: ${{ inputs.rust-components }}
      run: rustup component add $COMPONENTS
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      id: rust-cache
      with:
        workspaces: src-tauri
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ inputs.save-if }}
    # A cache restored for another Cargo.lock keeps every replaced crate version (rust-cache
    # prunes by crate name only), so caches saved from it grow with each dependency bump.
    # Caches that get saved start clean instead; PR runs keep the partial restore.
    - name: Start the Rust cache fresh after a Cargo.lock change
      if: inputs.save-if == 'true' && steps.rust-cache.outputs.cache-hit != 'true'
      shell: bash
      run: rm -rf "${CARGO_TARGET_DIR:-src-tauri/target}"
