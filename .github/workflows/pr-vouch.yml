name: PR Vouch

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  issue_comment:
    types: [created]
  push:
    branches:
      - main
    paths:
      - .github/VOUCHED.td
      - .github/workflows/pr-vouch.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  collect-targets:
    name: Collect PR targets
    # Most comments are not recheck commands; skip them before a runner starts.
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request && contains(github.event.comment.body, '/recheck-vouch'))
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.collect.outputs.targets }}
    steps:
      - id: collect
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (context.eventName === "pull_request_target") {
              const pr = context.payload.pull_request;
              core.setOutput("targets", JSON.stringify([{ number: pr.number, user: pr.user.login }]));
              return;
            }

            if (context.eventName === "issue_comment") {
              const issue = context.payload.issue;
              const body = context.payload.comment?.body ?? "";
              if (!issue?.pull_request || !body.includes("/recheck-vouch")) {
                core.setOutput("targets", "[]");
                return;
              }

              core.setOutput(
                "targets",
                JSON.stringify([{ number: issue.number, user: issue.user.login }]),
              );
              return;
            }

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });

            const targets = pulls.map((pull) => ({
              number: pull.number,
              user: pull.user.login,
            }));
            core.setOutput("targets", JSON.stringify(targets));

  label:
    name: Label PR ${{ matrix.target.number }}
    needs: collect-targets
    if: ${{ needs.collect-targets.outputs.targets != '[]' }}
    runs-on: ubuntu-24.04
    concurrency:
      group: pr-vouch-${{ matrix.target.number }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.collect-targets.outputs.targets) }}
    steps:
      # The label helpers are loaded from this checkout, so it must stay on a trusted ref:
      # the default ref is the base branch (pull_request_target), the default branch
      # (issue_comment) or main (push). Never check out the PR head here.
      - name: Checkout label helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - id: vouch
        name: Check PR author trust
        uses: mitchellh/vouch/action/check-user@d66fa29a64600490892131ad87597c30c91fcac4 # v1.5.0
        with:
          user: ${{ matrix.target.user }}
          allow-fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync PR labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ matrix.target.number }}
          VOUCH_STATUS: ${{ steps.vouch.outputs.status }}
        with:
          script: |
            const { ensureLabels, setExclusiveLabel } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/labels.cjs`);
            const issueNumber = Number(process.env.PR_NUMBER);
            const status = process.env.VOUCH_STATUS;
            const managedLabels = [
              {
                name: "vouch:trusted",
                color: "1f883d",
                description: "PR author is trusted by repo permissions or the VOUCHED list.",
              },
              {
                name: "vouch:unvouched",
                color: "fbca04",
                description: "PR author is not yet trusted in the VOUCHED list.",
              },
              {
                name: "vouch:denounced",
                color: "d1242f",
                description: "PR author is explicitly blocked by the VOUCHED list.",
              },
            ];

            const managedLabelNames = new Set(managedLabels.map((label) => label.name));

            await ensureLabels(github, context.repo, managedLabels);

            const nextLabelName =
              status === "denounced"
                ? "vouch:denounced"
                : ["bot", "collaborator", "vouched"].includes(status)
                  ? "vouch:trusted"
                  : "vouch:unvouched";

            await setExclusiveLabel(github, context.repo, issueNumber, managedLabelNames, nextLabelName);

            core.info(`PR #${issueNumber}: ${status} -> ${nextLabelName}`);
