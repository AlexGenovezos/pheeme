name: Site

# Deploys the marketing site and real app preview together on every main push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Use public DNS for apt
        # Ubuntu runners' resolver intermittently fails on every Ubuntu mirror
        # (2026-11-11), which breaks `playwright install --with-deps`.
        run: sudo resolvectl dns "$(ip route show default | awk '{print $5; exit}')" 1.1.1.1 8.8.8.8
      - run: npx playwright install --with-deps chromium
      # The browser checks build site/dist, including /demo from the app source.
      # A broken demo must not replace the live site.
      - run: npm run test:site

      # main -> production at pheeme.app
      - name: Deploy to pheeme.app
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.149.0"
          workingDirectory: site
          command: deploy

      # Pull requests -> a preview version; production untouched.
      # Fork and Dependabot PRs get no Actions secrets, so they skip this.
      - name: Upload preview version
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.149.0"
          workingDirectory: site
          command: versions upload --message "PR #${{ github.event.number }}"
