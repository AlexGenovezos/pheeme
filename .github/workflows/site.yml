name: Site

# Deploys the marketing site and real app preview together on every main push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The browser checks build site/dist, including /demo from the app source.
      # A broken demo must not replace the live site.
      - run: npm run test:site

      # main -> production at pheeme.app
      - name: Deploy to pheeme.app
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.149.0"
          workingDirectory: site
          command: deploy

      # Pull requests -> a preview version; production untouched.
      # Fork and Dependabot PRs get no Actions secrets, so they skip this.
      - name: Upload preview version
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.149.0"
          workingDirectory: site
          command: versions upload --message "PR #${{ github.event.number }}"
