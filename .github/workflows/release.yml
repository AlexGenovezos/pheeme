name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/version.mjs
      - scripts/updater-json.mjs
      - scripts/resolve-apple-env.sh
      - src-tauri/tauri.conf.json

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dry-run:
    name: Dry run (${{ matrix.os }})
    if: github.event_name != 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            bundle-dir: src-tauri/target/universal-apple-darwin/release/bundle
          - os: windows-latest
            args: ""
            bundle-dir: src-tauri/target/release/bundle
          - os: ubuntu-22.04
            args: ""
            bundle-dir: src-tauri/target/release/bundle
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install Ubuntu dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libsoup-3.0-dev libdbus-1-dev
      - run: rustup toolchain install
      - if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - if: matrix.os == 'ubuntu-22.04'
        run: bash scripts/resolve-apple-env.test.sh
      - run: npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}' ${{ matrix.args }}
      - uses: actions/upload-artifact@v7
        with:
          name: pheeme-dry-run-${{ matrix.os }}
          path: |
            ${{ matrix.bundle-dir }}/dmg/*.dmg
            ${{ matrix.bundle-dir }}/msi/*.msi
            ${{ matrix.bundle-dir }}/nsis/*.exe
            ${{ matrix.bundle-dir }}/appimage/*.AppImage
            ${{ matrix.bundle-dir }}/deb/*.deb
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Verify tag matches version
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/version.mjs check --tag "$GITHUB_REF_NAME"

  # One job creates the draft so the parallel builds upload to it instead of each racing to
  # create it. Reuses an existing release for the tag, so a re-run doesn't make a second one.
  create-release:
    name: Create draft release
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      id: ${{ steps.draft.outputs.id }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_NAME: ${{ format('Pheeme {0}{1}', github.ref_name, startsWith(github.ref_name, 'v0.') && ' beta' || '') }}
    steps:
      - id: draft
        run: |
          id=$(gh api "repos/$GH_REPO/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$GITHUB_REF_NAME\")][0].id // empty")
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/$GH_REPO/releases" -f tag_name="$GITHUB_REF_NAME" \
              -f target_commitish="$GITHUB_SHA" -f name="$RELEASE_NAME" -f body="" -F draft=true --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.os }})
    if: github.event_name == 'push'
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: windows-latest
            args: ""
          - os: ubuntu-22.04
            args: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install Ubuntu dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libsoup-3.0-dev libdbus-1-dev
      - run: rustup toolchain install
      - if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - name: apple-env
        if: matrix.os == 'macos-latest'
        run: bash scripts/resolve-apple-env.sh
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          # The publish job writes latest.json once all builds are up; per-build writes race.
          uploadUpdaterJson: false
          args: ${{ matrix.args }}

  publish:
    name: Publish release
    needs: [create-release, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Write latest.json
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.id }}
        run: |
          dir="$RUNNER_TEMP/updater"
          mkdir -p "$dir/sigs"
          gh api "repos/$GH_REPO/releases/$RELEASE_ID/assets?per_page=100" > "$dir/assets.json"
          gh release download "$GITHUB_REF_NAME" -p '*.sig' -D "$dir/sigs"
          node scripts/updater-json.mjs "$(node -p 'require("./package.json").version')" \
            "$dir/assets.json" "$dir/sigs" > "$dir/latest.json"
          gh release upload "$GITHUB_REF_NAME" "$dir/latest.json" --clobber
      - name: Validate latest.json on the draft
        run: |
          gh release download "$GITHUB_REF_NAME" -p latest.json -D "$RUNNER_TEMP"
          jq -e --arg v "${GITHUB_REF_NAME#v}.0" '
            .version == $v and
            ([.platforms["darwin-aarch64", "darwin-x86_64", "windows-x86_64", "linux-x86_64"]
              | (.url // "") != "" and (.signature // "") != ""] | all)
          ' "$RUNNER_TEMP/latest.json"
      - run: gh release edit "$GITHUB_REF_NAME" --draft=false
