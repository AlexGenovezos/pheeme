name: PR Size

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] PR commits are only fetched as git data; see the label job.
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  # Create and update the size:* label definitions.
  push:
    branches:
      - main
    paths:
      - .github/workflows/pr-size.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-config:
    name: Prepare PR size config
    runs-on: ubuntu-24.04
    outputs:
      labels_json: ${{ steps.config.outputs.labels_json }}
    steps:
      - id: config
        name: Build PR size label config
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          result-encoding: string
          script: |
            const managedLabels = [
              {
                name: "size:XS",
                color: "0e8a16",
                description: "0-9 effective changed lines (tests and generated files excluded in mixed PRs).",
              },
              {
                name: "size:S",
                color: "5ebd3e",
                description: "10-29 effective changed lines (tests and generated files excluded in mixed PRs).",
              },
              {
                name: "size:M",
                color: "fbca04",
                description: "30-99 effective changed lines (tests and generated files excluded in mixed PRs).",
              },
              {
                name: "size:L",
                color: "fe7d37",
                description: "100-499 effective changed lines (tests and generated files excluded in mixed PRs).",
              },
              {
                name: "size:XL",
                color: "d93f0b",
                description: "500-999 effective changed lines (tests and generated files excluded in mixed PRs).",
              },
              {
                name: "size:XXL",
                color: "b60205",
                description: "1,000+ effective changed lines (tests and generated files excluded in mixed PRs).",
              },
            ];

            core.setOutput("labels_json", JSON.stringify(managedLabels));
  sync-label-definitions:
    name: Sync PR size label definitions
    needs: prepare-config
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      # The label helpers are loaded from this checkout. This job never runs on
      # pull_request_target, so the ref is the trusted push or dispatch ref.
      - name: Checkout label helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Ensure PR size labels exist
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_SIZE_LABELS_JSON: ${{ needs.prepare-config.outputs.labels_json }}
        with:
          script: |
            const { ensureLabels } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/labels.cjs`);
            const managedLabels = JSON.parse(process.env.PR_SIZE_LABELS_JSON ?? "[]");

            await ensureLabels(github, context.repo, managedLabels);
  label:
    name: Label PR size
    needs: prepare-config
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
      pull-requests: write
    concurrency:
      group: pr-size-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # This pull_request_target job may fetch untrusted PR commits only as passive
      # git data. Do not add dependency installs, build/test scripts, or cache
      # actions here; use pull_request plus workflow_run for that pattern instead.
      - name: Checkout base repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Sync PR size label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_SIZE_LABELS_JSON: ${{ needs.prepare-config.outputs.labels_json }}
        with:
          script: |
            const { execFileSync } = require("node:child_process");
            // From the base checkout above; the PR head is only fetched as git data below.
            const { setExclusiveLabel } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/labels.cjs`);

            const issueNumber = context.payload.pull_request.number;
            const baseSha = context.payload.pull_request.base.sha;
            const headSha = context.payload.pull_request.head.sha;
            const headTrackingRef = `refs/remotes/pr-size/${issueNumber}`;
            const managedLabels = JSON.parse(process.env.PR_SIZE_LABELS_JSON ?? "[]");
            const managedLabelNames = new Set(managedLabels.map((label) => label.name));
            // Keep this aligned with the repo's test files, test-only support files, and generated
            // files (lockfiles, the SQLx offline cache) that add lines but not review work.
            // Inline Rust `#[cfg(test)] mod tests` blocks cannot be separated by path and still count.
            const testExcludePathspecs = [
              ":(glob,exclude)**/__tests__/**",
              ":(glob,exclude)**/test/**",
              ":(glob,exclude)**/tests/**",
              ":(glob,exclude)**/*.test.*",
              ":(glob,exclude)**/*.spec.*",
              ":(glob,exclude)src-tauri/src/sync/fake.rs",
              ":(glob,exclude)src-tauri/.sqlx/**",
              ":(glob,exclude)package-lock.json",
              ":(glob,exclude)src-tauri/Cargo.lock",
            ];

            const sumNumstat = (text) =>
              text
                .split("\n")
                .filter(Boolean)
                .reduce((total, line) => {
                  const [insertionsRaw = "0", deletionsRaw = "0"] = line.split("\t");
                  const additions =
                    insertionsRaw === "-" ? 0 : Number.parseInt(insertionsRaw, 10) || 0;
                  const deletions =
                    deletionsRaw === "-" ? 0 : Number.parseInt(deletionsRaw, 10) || 0;

                  return total + additions + deletions;
                }, 0);

            const resolveSizeLabel = (totalChangedLines) => {
              if (totalChangedLines < 10) {
                return "size:XS";
              }

              if (totalChangedLines < 30) {
                return "size:S";
              }

              if (totalChangedLines < 100) {
                return "size:M";
              }

              if (totalChangedLines < 500) {
                return "size:L";
              }

              if (totalChangedLines < 1000) {
                return "size:XL";
              }

              return "size:XXL";
            };

            execFileSync("git", ["fetch", "--no-tags", "origin", baseSha], {
              stdio: "inherit",
            });

            execFileSync(
              "git",
              ["fetch", "--no-tags", "origin", `+refs/pull/${issueNumber}/head:${headTrackingRef}`],
              {
                stdio: "inherit",
              },
            );

            const resolvedHeadSha = execFileSync("git", ["rev-parse", headTrackingRef], {
              encoding: "utf8",
            }).trim();

            if (resolvedHeadSha !== headSha) {
              core.warning(
                `Fetched head SHA ${resolvedHeadSha} does not match pull request head SHA ${headSha}; using fetched ref for sizing.`,
              );
            }

            execFileSync("git", ["cat-file", "-e", `${baseSha}^{commit}`], {
              stdio: "inherit",
            });

            const diffArgs = [
              "diff",
              "--numstat",
              "--ignore-all-space",
              "--ignore-blank-lines",
              `${baseSha}...${resolvedHeadSha}`,
            ];

            const totalChangedLines = sumNumstat(
              execFileSync(
                "git",
                diffArgs,
                { encoding: "utf8" },
              ),
            );
            const nonTestChangedLines = sumNumstat(
              execFileSync("git", [...diffArgs, "--", ".", ...testExcludePathspecs], {
                encoding: "utf8",
              }),
            );
            const testChangedLines = Math.max(0, totalChangedLines - nonTestChangedLines);

            const changedLines = nonTestChangedLines === 0 ? testChangedLines : nonTestChangedLines;
            const nextLabelName = resolveSizeLabel(changedLines);

            await setExclusiveLabel(github, context.repo, issueNumber, managedLabelNames, nextLabelName);

            const classification =
              nonTestChangedLines === 0
                ? testChangedLines > 0
                  ? "test-only PR"
                  : "no line changes"
                : testChangedLines > 0
                  ? "test lines excluded"
                  : "all non-test changes";

            core.info(
              `PR #${issueNumber}: ${nonTestChangedLines} non-test lines, ${testChangedLines} test lines, ${changedLines} effective lines -> ${nextLabelName} (${classification})`,
            );
