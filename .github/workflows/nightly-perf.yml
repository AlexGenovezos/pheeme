name: Nightly performance

# The long versions of the performance checks (#47), and the real-app run compared with the
# previous night. A run that measured something over budget opens an issue (or comments on the
# open one); a failure before measuring (install, build, seed) only fails the run. See
# docs/performance.md.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  # A PR that changes this workflow runs it before it lands. The real-app run itself
  # (app-perf.yml) runs from Performance on every PR that changes the app.
  pull_request:
    paths:
      - .github/workflows/nightly-perf.yml

permissions:
  contents: read

env:
  SQLX_OFFLINE: "true"

jobs:
  soak:
    name: Rust heap soak (long)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    outputs:
      perf-failed: ${{ steps.soak.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build
        with:
          node: "false"
          cache-key: ubuntu-22.04-soak
          save-if: false
      # Built in its own step so a build failure isn't reported as a heap failure.
      - name: Build the heap soak
        working-directory: src-tauri
        run: cargo test --locked --profile soak --features test-support --test soak --no-run
      - name: Heap soak (long)
        id: soak
        working-directory: src-tauri
        env:
          SOAK: long
        run: cargo test --locked --profile soak --features test-support --test soak -- --nocapture
      - name: Upload the heap profile
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dhat-heap
          path: src-tauri/target/tmp/soak/dhat-heap.json
          retention-days: 14

  app:
    name: Real app
    uses: ./.github/workflows/app-perf.yml
    with:
      nightly: ${{ github.event_name == 'schedule' }}

  report:
    name: Report failure
    needs: [soak, app]
    if: >-
      always() && github.event_name == 'schedule' &&
      (needs.soak.outputs.perf-failed == 'true' || needs.app.outputs.perf-failed == 'true')
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Open or update the nightly failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly performance check failed"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          body="The nightly performance run failed on $(date -u +%F) at ${GITHUB_SHA::7}: $RUN_URL"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body (see docs/performance.md)."
          fi
