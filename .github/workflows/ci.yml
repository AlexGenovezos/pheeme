name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SQLX_OFFLINE: "true"

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install Ubuntu dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libsoup-3.0-dev libdbus-1-dev
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.os || 'ubuntu-22.04' }}-debug
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - run: npm run version:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:ci
      - run: npx vite build
      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
      - name: Keychain round trip
        if: matrix.os != 'ubuntu-22.04'
        working-directory: src-tauri
        run: cargo test -- --ignored keyring_store_round_trip_on_this_os

  sqlx-cache:
    name: SQLx offline cache
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libsoup-3.0-dev libdbus-1-dev
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ubuntu-22.04-debug
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli@0.8.6
      - name: Validate SQLx cache
        working-directory: src-tauri
        run: |
          export DATABASE_URL="sqlite://$PWD/ci.sqlite"
          sqlx database create
          sqlx migrate run --source src/db/migrations
          cargo sqlx prepare --check -- --all-targets

  bundle:
    name: Bundle (${{ matrix.os }})
    if: github.event_name == 'pull_request'
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install Ubuntu dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libsoup-3.0-dev libdbus-1-dev
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.os || 'ubuntu-22.04' }}-debug
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - name: Bundle (deb)
        if: matrix.os == 'ubuntu-22.04'
        run: npx tauri build --debug --bundles deb --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Bundle (nsis)
        if: matrix.os == 'windows-latest'
        run: npx tauri build --debug --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Bundle (dmg)
        if: matrix.os == 'macos-latest'
        run: npx tauri build --debug --bundles dmg --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - uses: actions/upload-artifact@v7
        with:
          name: pheeme-${{ matrix.os }}
          path: |
            src-tauri/target/debug/bundle/deb/*.deb
            src-tauri/target/debug/bundle/nsis/*.exe
            src-tauri/target/debug/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7

  coverage:
    name: Coverage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libsoup-3.0-dev libdbus-1-dev
      - run: rustup toolchain install
      - run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ubuntu-22.04-coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Rust coverage
        working-directory: src-tauri
        shell: bash
        run: |
          set +e
          cargo llvm-cov --summary-only --fail-under-lines 75 | tee rust-coverage.txt
          status=${PIPESTATUS[0]}
          { echo '### Rust coverage'; echo '```'; grep -E "^(Filename|TOTAL)" rust-coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - run: npm ci
      - name: Frontend coverage
        shell: bash
        run: |
          set +e
          npm run test:coverage | tee frontend-coverage.txt
          status=${PIPESTATUS[0]}
          { echo '### Frontend coverage'; echo '```'; sed -n '/Coverage summary/,$p' frontend-coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
