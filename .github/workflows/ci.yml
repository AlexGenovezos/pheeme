name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SQLX_OFFLINE: "true"
  # Line tables keep panic locations but drop most debug info: smaller caches (they were over
  # GitHub's 10 GB repo limit), faster links, faster cache saves on Windows.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # Which halves a pull request touches. main runs everything (this job is skipped there), and
  # if the file list can't be read, or this job fails, everything runs too.
  changes:
    name: What does this PR change?
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.files.outputs.rust }}
      bundle: ${{ steps.files.outputs.bundle }}
    steps:
      - name: List the changed files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if ! files=$(gh api --paginate "repos/$GH_REPO/pulls/$PR/files?per_page=100" --jq '.[] | .filename, (.previous_filename // empty)'); then
            printf 'rust=true\nbundle=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The crate, its build settings, the example mods its tests read, or this workflow.
          if grep -qE '^(src-tauri/|\.cargo/|examples/mods/|\.github/actions/setup-build/)|^(rust-toolchain\.toml|\.github/workflows/ci\.yml)$' <<<"$files"; then
            printf 'rust=true\nbundle=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "rust=false" >> "$GITHUB_OUTPUT"
          echo "No Rust change: skipping the Rust checks, SQLx cache and Rust coverage."
          # The Tauri CLI, the Node version and the Vite output folder (Tauri's frontendDist) the
          # bundles are built with. The frontend itself is built and tested by the web job.
          if grep -qE '^(package(-lock)?\.json|\.nvmrc|vite\.config\.ts)$' <<<"$files"; then
            echo "bundle=true" >> "$GITHUB_OUTPUT"
          else
            echo "bundle=false" >> "$GITHUB_OUTPUT"
            echo "No Rust or build-tool change: skipping the bundles."
          fi

  # The frontend and Rust halves run as separate jobs so neither waits for the other. Linux only:
  # typecheck, lint, vitest (jsdom) and the Vite build don't depend on the OS, and the bundle
  # jobs still build the frontend on macOS and Windows.
  web:
    name: Web checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - run: npm run typecheck
      - run: npm run lint
      # knip.json says which files are entry points; .duplication-baseline.json holds the copies
      # that were already there.
      - name: Dead code
        run: npm run deadcode
      - name: Duplicated code
        run: npm run dupes
      - run: npm run format:check
      # The one vitest run, with coverage (thresholds in vitest.config.ts).
      - name: Frontend tests and coverage
        shell: bash
        run: |
          set +e
          npm run test:coverage | tee frontend-coverage.txt
          status=${PIPESTATUS[0]}
          { echo '### Frontend coverage'; echo '```'; sed -n '/Coverage summary/,$p' frontend-coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Use public DNS for apt
        # Ubuntu runners' resolver intermittently fails on every Ubuntu mirror
        # (2026-11-11), which breaks `playwright install --with-deps`.
        run: sudo resolvectl dns "$(ip route show default | awk '{print $5; exit}')" 1.1.1.1 8.8.8.8
      - name: Install browser for mod UI proof
        run: npx playwright install --with-deps chromium
      - name: Browser interaction flows
        # Every spec in e2e/ except the memory one (perf.yml runs it as test:memory), so a new
        # spec can't be silently skipped. Its web server runs `vite build` first, which is this
        # job's production build check.
        run: |
          shopt -s extglob
          npx playwright test e2e/!(memory).spec.ts --reporter=list,html
      - name: Mod UI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mod-ui-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 7
      - run: node --test .github/scripts/labels.test.cjs

  rust:
    name: Rust checks (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
        # The Linux cache was renamed from ubuntu-22.04-debug, which held only the SQLx job's
        # type-check output: rust-cache never re-saves a key it restored exactly.
        include:
          - os: ubuntu-22.04
            cache-key: ubuntu-22.04-dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          node: "false"
          cache-key: ${{ matrix.cache-key || format('{0}-debug', matrix.os) }}
      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check
      # Linux only: on macOS and Windows clippy compiled the crate a second time (~1 min each).
      - name: Rust clippy
        if: matrix.os == 'ubuntu-22.04'
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      - name: Keychain round trip
        if: matrix.os != 'ubuntu-22.04'
        working-directory: src-tauri
        run: cargo test --locked -- --ignored keyring_store_round_trip_on_this_os

  # The ruleset on main requires "Checks (<os>)", the job before it was split in two. Each one
  # passes only when every gating job did: it always runs, because a skipped required check
  # counts as passed. A job skipped by its own `if` (bundle runs on pull requests only, the Rust
  # jobs when `changes` finds no Rust change) counts as a pass; failed or cancelled is a failure.
  checks:
    name: Checks (${{ matrix.os }})
    needs: [web, rust, sqlx-cache, coverage, bundle]
    if: always()
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    steps:
      - name: Every gating job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null

  sqlx-cache:
    name: SQLx offline cache
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          node: "false"
          cache-key: ubuntu-22.04-dev
          # Never saved: this job only type-checks, and finishing first, it won the race to
          # save the shared cache, so every Linux build after it recompiled all ~470 crates.
          save-if: "false"
      # sqlx-cli has no prebuilt binary, so it's built once and cached (the build took ~105s).
      - id: sqlx-cli
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/sqlx
            ~/.cargo/bin/cargo-sqlx
          key: sqlx-cli-0.9.0-sqlite-${{ runner.os }}-${{ runner.arch }}
      # --force: the Rust cache can bring back ~/.cargo/bin/sqlx without cargo's install record,
      # and then a plain install refuses to overwrite it.
      - if: steps.sqlx-cli.outputs.cache-hit != 'true'
        run: cargo install sqlx-cli@0.9.0 --force --locked --no-default-features --features sqlite,rustls
      - name: Validate SQLx cache
        working-directory: src-tauri
        run: |
          export DATABASE_URL="sqlite://$PWD/ci.sqlite"
          sqlx database create
          sqlx migrate run --source src/db/migrations
          cargo sqlx prepare --check -- --all-targets --locked

  bundle:
    name: Bundle (${{ matrix.os }})
    # Runs alongside the checks rather than after them: waiting cost ~4 min per PR.
    needs: changes
    # The ruleset requires "Bundle (<os>)" itself, and a job skipped by its `if` never expands its
    # matrix, so those checks would never report. A PR that needs no bundle skips the steps.
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    env:
      BUILD: ${{ needs.changes.result != 'success' || needs.changes.outputs.bundle == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
        include:
          - os: ubuntu-22.04
            cache-key: ubuntu-22.04-dev
    steps:
      - if: env.BUILD != 'true'
        run: echo "No Rust or build-tool change, so no bundle is needed."
      - if: env.BUILD == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: env.BUILD == 'true'
        uses: ./.github/actions/setup-build
        with:
          cache-key: ${{ matrix.cache-key || format('{0}-debug', matrix.os) }}
      - if: env.BUILD == 'true'
        run: npm ci
      - name: Bundle (deb)
        if: env.BUILD == 'true' && matrix.os == 'ubuntu-22.04'
        run: npx tauri build --debug --bundles deb --config '{"bundle":{"createUpdaterArtifacts":false}}' -- --locked
      - name: Bundle (nsis)
        if: env.BUILD == 'true' && matrix.os == 'windows-latest'
        run: npx tauri build --debug --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}' -- --locked
      # Runs the installer the way a user does (no flags). Our template
      # (src-tauri/windows/installer.nsi) makes that a one-click install, so it
      # must finish with no input and open Pheeme; a wizard page would wait forever.
      - name: Install (one-click)
        if: env.BUILD == 'true' && matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Save-Screen($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("src-tauri/target/debug/bundle/nsis/$name.png")
          }
          $setup = Get-ChildItem src-tauri/target/debug/bundle/nsis/*-setup.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -PassThru
          Start-Sleep -Milliseconds 1500
          Save-Screen 'installing'
          if (-not $p.WaitForExit(120000)) {
            Save-Screen 'stuck'
            Stop-Process $p -Force
            throw 'The installer is waiting for input: a wizard page is showing.'
          }
          if ($p.ExitCode -ne 0) { throw "The installer exited with $($p.ExitCode)." }
          if (-not (Test-Path "$env:LOCALAPPDATA\Pheeme\pheeme.exe")) { throw 'Pheeme was not installed.' }
          Start-Sleep -Seconds 10
          Save-Screen 'opened'
          if (-not (Get-Process pheeme -ErrorAction SilentlyContinue)) { throw 'Pheeme did not open after installing.' }
          Stop-Process -Name pheeme -Force
      - name: Bundle (dmg)
        if: env.BUILD == 'true' && matrix.os == 'macos-latest'
        run: npx tauri build --debug --bundles dmg --config '{"bundle":{"createUpdaterArtifacts":false}}' -- --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && env.BUILD == 'true' }}
        with:
          name: pheeme-${{ matrix.os }}
          path: |
            src-tauri/target/debug/bundle/deb/*.deb
            src-tauri/target/debug/bundle/nsis/*.exe
            src-tauri/target/debug/bundle/nsis/*.png
            src-tauri/target/debug/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7

  # Rust only: the web job's vitest run measures frontend coverage.
  coverage:
    name: Coverage
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          node: "false"
          rust-components: llvm-tools-preview
          cache-key: ubuntu-22.04-coverage
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Rust coverage
        working-directory: src-tauri
        shell: bash
        run: |
          set +e
          cargo llvm-cov --locked --summary-only --fail-under-lines 88 | tee rust-coverage.txt
          status=${PIPESTATUS[0]}
          { echo '### Rust coverage'; echo '```'; grep -E "^(Filename|TOTAL)" rust-coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
