name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SQLX_OFFLINE: "true"
  # Line tables keep panic locations but drop most debug info: smaller caches (they were over
  # GitHub's 10 GB repo limit), faster links, faster cache saves on Windows.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build
        with:
          cache-key: ${{ matrix.os || 'ubuntu-22.04' }}-debug
      - run: npm ci
      - run: npm run version:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:ci
      - name: Install browser for mod UI proof
        if: matrix.os == 'ubuntu-22.04'
        run: npx playwright install --with-deps chromium
      - name: Browser interaction flows
        if: matrix.os == 'ubuntu-22.04'
        run: npx playwright test e2e/mods.spec.ts e2e/email-keyboard.spec.ts e2e/unread-filter.spec.ts e2e/search.spec.ts e2e/sync-progress.spec.ts e2e/custom-themes.spec.ts e2e/category-move.spec.ts e2e/pptx-preview.spec.ts e2e/quick-add.spec.ts --reporter=list,html
      - name: Mod UI evidence
        if: always() && matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mod-ui-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 7
      - run: node --test .github/scripts/labels.test.cjs
      - run: npx vite build
      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check
      # Linux only: on macOS and Windows clippy compiled the crate a second time (~1 min each).
      - name: Rust clippy
        if: matrix.os == 'ubuntu-22.04'
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      - name: Keychain round trip
        if: matrix.os != 'ubuntu-22.04'
        working-directory: src-tauri
        run: cargo test --locked -- --ignored keyring_store_round_trip_on_this_os

  sqlx-cache:
    name: SQLx offline cache
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build
        with:
          node: "false"
          cache-key: ubuntu-22.04-debug
      # sqlx-cli has no prebuilt binary, so it's built once and cached (the build took ~105s).
      - id: sqlx-cli
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/sqlx
            ~/.cargo/bin/cargo-sqlx
          key: sqlx-cli-0.9.0-sqlite-${{ runner.os }}-${{ runner.arch }}
      # --force: the Rust cache can bring back ~/.cargo/bin/sqlx without cargo's install record,
      # and then a plain install refuses to overwrite it.
      - if: steps.sqlx-cli.outputs.cache-hit != 'true'
        run: cargo install sqlx-cli@0.9.0 --force --locked --no-default-features --features sqlite,rustls
      - name: Validate SQLx cache
        working-directory: src-tauri
        run: |
          export DATABASE_URL="sqlite://$PWD/ci.sqlite"
          sqlx database create
          sqlx migrate run --source src/db/migrations
          cargo sqlx prepare --check -- --all-targets --locked

  bundle:
    name: Bundle (${{ matrix.os }})
    # Runs alongside `checks` rather than after it: waiting cost ~4 min per PR.
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build
        with:
          cache-key: ${{ matrix.os || 'ubuntu-22.04' }}-debug
      - run: npm ci
      - name: Bundle (deb)
        if: matrix.os == 'ubuntu-22.04'
        run: npx tauri build --debug --bundles deb --config '{"bundle":{"createUpdaterArtifacts":false}}' -- --locked
      - name: Bundle (nsis)
        if: matrix.os == 'windows-latest'
        run: npx tauri build --debug --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}' -- --locked
      # Runs the installer the way a user does (no flags). Our template
      # (src-tauri/windows/installer.nsi) makes that a one-click install, so it
      # must finish with no input and open Pheeme; a wizard page would wait forever.
      - name: Install (one-click)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Save-Screen($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("src-tauri/target/debug/bundle/nsis/$name.png")
          }
          $setup = Get-ChildItem src-tauri/target/debug/bundle/nsis/*-setup.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -PassThru
          Start-Sleep -Milliseconds 1500
          Save-Screen 'installing'
          if (-not $p.WaitForExit(120000)) {
            Save-Screen 'stuck'
            Stop-Process $p -Force
            throw 'The installer is waiting for input: a wizard page is showing.'
          }
          if ($p.ExitCode -ne 0) { throw "The installer exited with $($p.ExitCode)." }
          if (-not (Test-Path "$env:LOCALAPPDATA\Pheeme\pheeme.exe")) { throw 'Pheeme was not installed.' }
          Start-Sleep -Seconds 10
          Save-Screen 'opened'
          if (-not (Get-Process pheeme -ErrorAction SilentlyContinue)) { throw 'Pheeme did not open after installing.' }
          Stop-Process -Name pheeme -Force
      - name: Bundle (dmg)
        if: matrix.os == 'macos-latest'
        run: npx tauri build --debug --bundles dmg --config '{"bundle":{"createUpdaterArtifacts":false}}' -- --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: pheeme-${{ matrix.os }}
          path: |
            src-tauri/target/debug/bundle/deb/*.deb
            src-tauri/target/debug/bundle/nsis/*.exe
            src-tauri/target/debug/bundle/nsis/*.png
            src-tauri/target/debug/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7

  coverage:
    name: Coverage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build
        with:
          rust-components: llvm-tools-preview
          cache-key: ubuntu-22.04-coverage
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Rust coverage
        working-directory: src-tauri
        shell: bash
        run: |
          set +e
          cargo llvm-cov --locked --summary-only --fail-under-lines 75 | tee rust-coverage.txt
          status=${PIPESTATUS[0]}
          { echo '### Rust coverage'; echo '```'; grep -E "^(Filename|TOTAL)" rust-coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - run: npm ci
      - name: Frontend coverage
        shell: bash
        run: |
          set +e
          npm run test:coverage | tee frontend-coverage.txt
          status=${PIPESTATUS[0]}
          { echo '### Frontend coverage'; echo '```'; sed -n '/Coverage summary/,$p' frontend-coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
